name: Check Pricing Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-pricing-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get current pricing period date
        id: current
        run: |
          date=$(python3 -c "import json; d=json.load(open('pricing.json')); print(d['pricing_periods'][0]['effective_from'])")
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Ensure pricing label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create pricing --description "Pricing data updates" --color "0075ca" 2>/dev/null || true

      - name: Create pricing update issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Check for Copilot pricing updates (current: ${{ steps.current.outputs.date }})"
          body=$(cat <<'EOF'
          ## Task

          Check if GitHub Copilot model pricing or premium request multipliers have changed since **${{ steps.current.outputs.date }}**.

          ## What to check

          1. **Premium request multipliers**: https://docs.github.com/en/copilot/reference/ai-models/supported-models
          2. **Anthropic pricing**: https://www.anthropic.com/pricing
          3. **OpenAI pricing**: https://openai.com/api/pricing/
          4. **Google pricing**: https://ai.google.dev/pricing

          ## What to do

          - If any pricing has changed, add a new period to the top of \`pricing.json\` following the format described in \`.github/copilot-instructions.md\`
          - If no changes are found, close this issue with a comment saying pricing is up to date
          - Make sure all model entries are present in the new period (copy from previous, then apply changes)

          ## Current latest period

          \`\`\`
          effective_from: ${{ steps.current.outputs.date }}
          \`\`\`
          EOF
          )

          issue_url=$(gh issue create \
            --title "$title" \
            --label "pricing" \
            --body "$body")
          issue_number="${issue_url##*/}"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Assign Copilot to issue (GraphQL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_ASSIGNABLE_NODE_ID: ${{ vars.COPILOT_ASSIGNABLE_NODE_ID }}
        run: |
          issue_number="${{ steps.create_issue.outputs.issue_number }}"

          issue_id=$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){issue(number:$number){id}}}' \
            -f owner='${{ github.repository_owner }}' \
            -f repo='${{ github.event.repository.name }}' \
            -F number="$issue_number" \
            --jq '.data.repository.issue.id')

          copilot_id="${COPILOT_ASSIGNABLE_NODE_ID:-}"
          if [ -z "$copilot_id" ]; then
            copilot_id=$(gh api graphql \
              -f query='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){issue(number:1){assignees(first:20){nodes{id login}}}}}' \
              -f owner='${{ github.repository_owner }}' \
              -f repo='${{ github.event.repository.name }}' \
              --jq '.data.repository.issue.assignees.nodes[]? | select(.login=="Copilot") | .id' 2>/dev/null || true)
          fi

          if [ -z "$copilot_id" ]; then
            echo "Could not resolve Copilot node ID; leaving issue #$issue_number unassigned."
            exit 0
          fi

          if gh api graphql \
            -f query='mutation($assignableId:ID!,$assigneeId:ID!){addAssigneesToAssignable(input:{assignableId:$assignableId,assigneeIds:[$assigneeId]}){assignable{... on Issue{number assignees(first:10){nodes{login}}}}}}' \
            -f assignableId="$issue_id" \
            -f assigneeId="$copilot_id" >/dev/null; then
            echo "Assigned Copilot to issue #$issue_number."
          else
            echo "Could not assign Copilot via GraphQL; leaving issue #$issue_number unassigned."
          fi
