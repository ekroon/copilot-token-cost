name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.19.0) — required when dispatching manually"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Embed pricing data
        run: |
          cd go
          printf 'package main\n\nvar embeddedPricingJSON = `' > pricing_data.go
          cat ../pricing.json >> pricing_data.go
          printf '`\n' >> pricing_data.go

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go
          output="copilot-token-cost-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "../${output}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-token-cost-${{ matrix.goos }}-${{ matrix.goarch }}
          path: copilot-token-cost-${{ matrix.goos }}-${{ matrix.goarch }}

  desktop-macos:
    needs: resolve-tag
    strategy:
      matrix:
        include:
          - runner: macos-latest
            goarch: arm64
            target_triple: aarch64-apple-darwin
          - runner: macos-15-intel
            goarch: amd64
            target_triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build Go sidecar with embedded pricing
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go
          printf 'package main\n\nvar embeddedPricingJSON = `' > pricing_data.go
          cat ../pricing.json >> pricing_data.go
          printf '`\n' >> pricing_data.go
          GOOS=darwin GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" \
            -o ../desktop/src-tauri/binaries/copilot-token-cost-${{ matrix.target_triple }} .

      - name: Install desktop dependencies
        run: cd desktop && npm install

      - name: Prepare Apple signing keychain
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/app-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Build Tauri app (.app bundle only)
        run: cd desktop && npx tauri build --bundles app

      - name: Sign app bundle with Developer ID
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/Copilot Token Cost.app"
          codesign --force --deep --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Re-sign app bundle ad-hoc
        if: ${{ !(secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '') }}
        run: |
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/Copilot Token Cost.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"

      - name: Notarize app bundle
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="desktop/src-tauri/target/release/bundle/macos/Copilot Token Cost.app"
          APP_ZIP="desktop/src-tauri/target/release/bundle/macos/Copilot Token Cost.zip"
          rm -f "$APP_ZIP"
          ditto -c -k --keepParent "$APP_PATH" "$APP_ZIP"
          xcrun notarytool submit "$APP_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          rm -f "$APP_ZIP"

      - name: Create DMG
        run: |
          APP_NAME="Copilot Token Cost"
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          STAGING_DIR="desktop/src-tauri/target/release/bundle/dmg-root"
          rm -rf "$STAGING_DIR"
          mkdir -p "$DMG_DIR"
          mkdir -p "$STAGING_DIR"
          cp -R "desktop/src-tauri/target/release/bundle/macos/${APP_NAME}.app" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "$DMG_DIR/${APP_NAME}_${{ matrix.target_triple }}.dmg"

      - name: Sign and notarize DMG
        if: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="desktop/src-tauri/target/release/bundle/dmg/Copilot Token Cost_${{ matrix.target_triple }}.dmg"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          codesign --verify --verbose=4 "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopilotTokenCost-${{ matrix.target_triple }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Clean up Apple signing keychain
        if: ${{ always() && secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/app-signing.p12"

  create-release:
    needs: [resolve-tag, release, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x artifacts/copilot-token-cost-*
          gh release create "${{ needs.resolve-tag.outputs.tag }}" \
            --title "${{ needs.resolve-tag.outputs.tag }}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            artifacts/copilot-token-cost-* \
            artifacts/*.dmg
