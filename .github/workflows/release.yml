name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.19.0) — required when dispatching manually"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Embed pricing data
        run: |
          cd go
          printf 'package main\n\nvar embeddedPricingJSON = `' > pricing_data.go
          cat ../pricing.json >> pricing_data.go
          printf '`\n' >> pricing_data.go

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go
          output="copilot-token-cost-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "../${output}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-token-cost-${{ matrix.goos }}-${{ matrix.goarch }}
          path: copilot-token-cost-${{ matrix.goos }}-${{ matrix.goarch }}

  desktop-macos:
    needs: resolve-tag
    strategy:
      matrix:
        include:
          - runner: macos-latest
            goarch: arm64
            target_triple: aarch64-apple-darwin
          - runner: macos-15-intel
            goarch: amd64
            target_triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build Go sidecar with embedded pricing
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd go
          printf 'package main\n\nvar embeddedPricingJSON = `' > pricing_data.go
          cat ../pricing.json >> pricing_data.go
          printf '`\n' >> pricing_data.go
          GOOS=darwin GOARCH=$GOARCH go build -trimpath -ldflags="-s -w" \
            -o ../desktop/src-tauri/binaries/copilot-token-cost-${{ matrix.target_triple }} .

      - name: Install desktop dependencies
        run: cd desktop && npm install

      - name: Build Tauri app (.app bundle only)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop && npx tauri build --bundles app

      - name: Create DMG
        run: |
          APP_NAME="Copilot Token Cost"
          DMG_DIR="desktop/src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "desktop/src-tauri/target/release/bundle/macos/${APP_NAME}.app" \
            -ov -format UDZO \
            "$DMG_DIR/${APP_NAME}_${{ matrix.target_triple }}.dmg"

      - name: Rename updater artifacts with target triple
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle/macos"
          for f in "$BUNDLE_DIR"/*.app.tar.gz; do
            base="$(basename "$f" .app.tar.gz)"
            mv "$f" "$BUNDLE_DIR/${base}_${{ matrix.target_triple }}.app.tar.gz"
            mv "$f.sig" "$BUNDLE_DIR/${base}_${{ matrix.target_triple }}.app.tar.gz.sig"
          done

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopilotTokenCost-${{ matrix.target_triple }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  create-release:
    needs: [resolve-tag, release, desktop-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json for updater
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # Read version without the 'v' prefix
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Read signatures
          AARCH64_SIG="$(cat artifacts/*_aarch64-apple-darwin.app.tar.gz.sig)"
          X86_64_SIG="$(cat artifacts/*_x86_64-apple-darwin.app.tar.gz.sig)"

          # Find artifact filenames
          AARCH64_FILE="$(basename artifacts/*_aarch64-apple-darwin.app.tar.gz)"
          X86_64_FILE="$(basename artifacts/*_x86_64-apple-darwin.app.tar.gz)"

          cat > artifacts/latest.json <<EOF
          {
            "version": "${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${AARCH64_SIG}",
                "url": "${BASE_URL}/${AARCH64_FILE}"
              },
              "darwin-x86_64": {
                "signature": "${X86_64_SIG}",
                "url": "${BASE_URL}/${X86_64_FILE}"
              }
            }
          }
          EOF

          # Remove leading whitespace from heredoc indentation
          python3 -c "
          import json, sys
          with open('artifacts/latest.json') as f:
              data = json.load(f)
          with open('artifacts/latest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x artifacts/copilot-token-cost-*
          gh release create "${{ needs.resolve-tag.outputs.tag }}" \
            --title "${{ needs.resolve-tag.outputs.tag }}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            artifacts/copilot-token-cost-* \
            artifacts/*.dmg \
            artifacts/*.app.tar.gz \
            artifacts/*.app.tar.gz.sig \
            artifacts/latest.json
