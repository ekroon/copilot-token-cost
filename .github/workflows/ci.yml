name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: cd go && go build -o copilot-token-cost .
      - run: cd go && go vet ./...
      - run: cd go && go test ./...
      - run: ./scripts/check-performance.sh
