<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Token Cost</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: #0d1117; color: #c9d1d9;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto 16px;
      border: 3px solid #30363d; border-top-color: #58a6ff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #8b949e; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Starting Copilot Token Cost…</p>
  </div>
  <script>
    const SERVER = 'http://127.0.0.1:7332';
    const poll = setInterval(async () => {
      try {
        const res = await fetch(SERVER + '/healthz', { mode: 'no-cors' });
        clearInterval(poll);
        window.location.replace(SERVER);
      } catch (e) {
        // server not ready yet
      }
    }, 300);
  </script>
</body>
</html>
